<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selecionando elementos do DOM</title>
    <!-- Importando o CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Iniciando os estudos com DOM e Javascript</h1>
    <p> Capturando o primeiro elemento do DOM com JavaScript</p>
    <p>Eu sou um outro parágrafo . . .</p>
    <p id="paragrafoID">paragrafo1</p>
    <p name="paragrafoNAME">paragrafo2</p>
    <p class="paragrafoCLASS">paragrafo3</p>
    <p id="query">paragrafo4</p>
    <script src="script.js"></script>
</body>
</html>
