<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo com Javascript</title>
    <!-- importando css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Semáforo com Javascript</h1>

    <div class="container">
        <div class="semaforo">
            <div class="luz" id="parar"></div>
            <div class="luz" id="atencao"></div>
            <div class="luz" id="seguir"></div>
        </div>
        <br>
        <!-- botoes -->
        <div>
            <button onclick = "parar()" id="btnPare">Pare!</button>
            <button onclick = "atencao()" id="btnAtencao">Atenção!</button>
            <button onclick = "seguir()" id="btnSiga">Siga!</button>
        </div>
    </div>

    <!-- Importando o arquivo javascript -->
    <script src="script.js"></script>
</body>
</html>
